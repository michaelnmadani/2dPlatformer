<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Frog Prince FABLE 5.2</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🐸</text></svg>">
    <style>
        @font-face {
            font-family: 'Cinzel';
            font-weight: 700;
            font-display: swap;
            src: url('fonts/cinzel-700.woff2') format('woff2');
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(ellipse at center, #16233f 0%, #070b18 75%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', serif;
        }
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            max-width: 1200px;
            max-height: 750px;
            object-fit: contain;
            cursor: pointer;
            touch-action: none;
        }
        #loading {
            position: absolute;
            color: #ffd24a;
            font-size: 18px;
            letter-spacing: 4px;
            font-family: 'Cinzel', Georgia, serif;
            font-weight: 700;
            text-align: center;
        }
        #loading .edition {
            font-size: 26px;
            letter-spacing: 8px;
            margin-bottom: 18px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
        }
        #loading img {
            display: block;
            width: 300px;
            max-width: 80vw;
            margin: 0 auto 20px;
            filter: drop-shadow(0 0 18px rgba(50, 170, 30, 0.45));
        }
        #loading .bar-outer {
            width: 200px;
            height: 8px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 4px;
            margin: 12px auto 0;
            overflow: hidden;
        }
        #loading .bar-inner {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #59d66b, #ffd24a);
            border-radius: 4px;
            transition: width 0.15s;
        }
    </style>
</head>
<body>
    <div id="loading"><img src="assets/title-logo.png" alt="The Frog Prince"><div class="edition">FABLE 5.2</div>LOADING<div class="bar-outer"><div class="bar-inner" id="loadBar"></div></div></div>
    <canvas id="gameCanvas"></canvas>
    <script>
        // Make sure the heading font is ready for canvas text
        if (document.fonts && document.fonts.load) document.fonts.load("700 16px Cinzel");
    </script>
    <script src="js/assets.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/fx.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/physics.js"></script>
    <script src="js/entities.js"></script>
    <script src="js/levels.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
