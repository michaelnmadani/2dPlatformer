<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frog Prince - A Fairy Tale Platformer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a0a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', serif;
        }
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: pointer;
        }
        #loading {
            position: absolute;
            color: #8f8;
            font-size: 24px;
            font-family: Georgia, serif;
            text-align: center;
        }
        #loading .bar-outer {
            width: 200px;
            height: 8px;
            background: #1a3a1a;
            border-radius: 4px;
            margin: 12px auto 0;
            overflow: hidden;
        }
        #loading .bar-inner {
            height: 100%;
            width: 0%;
            background: #4a2;
            border-radius: 4px;
            transition: width 0.15s;
        }
    </style>
</head>
<body>
    <div id="loading">Loading...<div class="bar-outer"><div class="bar-inner" id="loadBar"></div></div></div>
    <canvas id="gameCanvas"></canvas>
    <script src="js/assets.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/physics.js"></script>
    <script src="js/entities.js"></script>
    <script src="js/levels.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
